name: MAX channel

# Независимая проверка ветки feat/max-channel: не требует PR и слияния в main.
# Запускает всё, что относится к MAX, на реально собранном Eve (Node 24).
on:
  push:
    branches:
      - feat/max-channel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: max-channel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Whitespace check
        run: git diff --check HEAD~1 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Show runtime
        run: |
          node --version
          npm --version
          id -u

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Full Node.js test suite
        run: node --test agent/lib/*.test.mjs scripts/lib/*.test.mjs scripts/lib/menu/*.test.mjs scripts/*.test.mjs

      - name: Build Eve application
        run: npm run build

      - name: Replica smoke (isolated install + mock provider)
        run: npm run replica

      - name: MAX e2e - channel and polling bridge (built Eve, mock model, mock MAX API)
        timeout-minutes: 10
        run: npm run test:max-e2e

      - name: MAX e2e - webhook production topology (built Eve, mock model, mock MAX API)
        timeout-minutes: 10
        run: npm run test:max-webhook-e2e

      - name: Secrets must not be tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$'; then echo "tracked env file"; exit 1; fi
          if git ls-files data | grep .; then echo "tracked data files"; exit 1; fi
