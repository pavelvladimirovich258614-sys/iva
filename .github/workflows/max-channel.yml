name: MAX channel

# Независимая проверка веток feat/max-channel и feat/max-full-media: не требует слияния в main.
# Запускает всё, что относится к MAX, на реально собранном Eve (Node 24).
on:
  push:
    branches:
      - feat/max-channel
      - feat/max-full-media
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: max-channel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Whitespace check
        run: git diff --check HEAD~1 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Show runtime
        run: |
          node --version
          npm --version
          id -u

      - name: Install poppler (pdftotext / pdftoppm for PDF attachments)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Full Node.js test suite
        run: node --test agent/lib/*.test.mjs scripts/lib/*.test.mjs scripts/lib/menu/*.test.mjs scripts/*.test.mjs

      - name: Build Eve application
        run: npm run build

      - name: Replica smoke (isolated install + mock provider)
        run: npm run replica

      - name: MAX-only install regression (no TELEGRAM_* anywhere)
        run: node --test scripts/lib/max-only-install.test.mjs scripts/lib/max-setup.test.mjs

      - name: Attachment download / upload security (SSRF, size limits, real-type sniffing, send policy)
        run: >-
          node --test
          agent/lib/safe-http.test.mjs
          agent/lib/media-docs.test.mjs
          agent/lib/max-media.test.mjs
          agent/lib/max-attachments.test.mjs
          agent/lib/max-upload.test.mjs

      - name: MAX e2e - channel and polling bridge (built Eve, mock model, mock MAX API)
        timeout-minutes: 10
        run: npm run test:max-e2e

      - name: MAX e2e - webhook production topology (built Eve, mock model, mock MAX API)
        timeout-minutes: 10
        run: npm run test:max-webhook-e2e

      - name: MAX media e2e - voice, photos, documents, outbound files (webhook AND polling, built Eve)
        timeout-minutes: 12
        run: npm run test:max-media-e2e

      - name: Secrets must not be tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$'; then echo "tracked env file"; exit 1; fi
          if git ls-files data | grep .; then echo "tracked data files"; exit 1; fi
